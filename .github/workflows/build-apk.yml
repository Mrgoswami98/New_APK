name: Build APK

# Unzips HDVideoPlayer-source.zip, builds the release APK, uploads it as a
# run artifact and publishes it as a GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -q -o HDVideoPlayer-source.zip -d src
          rm -rf src/HDVideoPlayer/.gradle
          ls -R src/HDVideoPlayer | head -50

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: src/HDVideoPlayer
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp src/HDVideoPlayer/app/build/outputs/apk/release/*.apk out/HDVideoPlayer-v1.0-build${{ github.run_number }}.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hd-video-player-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HD Video Player v1.0 (build ${{ github.run_number }})
          body: |
            Release APK built from HDVideoPlayer-source.zip.
            Signed with the debug key: installs on phones (allow "Install unknown apps"), not accepted by Play Store.
          files: out/*.apk
