name: Build APK

# Unzips HDVideoPlayer-source.zip, builds the release APK, uploads it as a
# run artifact and publishes it as a GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Unzip source
        run: |
          unzip -q -o HDVideoPlayer-source.zip -d src
          rm -rf src/HDVideoPlayer/.gradle
          ls -R src/HDVideoPlayer | head -50

      # Media3 1.4.x BaseGlShaderProgram.configure() returns androidx.media3.common.util.Size
      - name: Patch Size import
        run: |
          sed -i 's/^import android.util.Size$/import androidx.media3.common.util.Size/' src/HDVideoPlayer/app/src/main/java/com/oakcraft/hdplayer/enhance/*ShaderProgram.kt
          grep -n 'import .*Size' src/HDVideoPlayer/app/src/main/java/com/oakcraft/hdplayer/enhance/*ShaderProgram.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Runner images ship with the Android SDK preinstalled (ANDROID_HOME).
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: src/HDVideoPlayer
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp src/HDVideoPlayer/app/build/outputs/apk/release/*.apk out/HDVideoPlayer-v1.0-build${{ github.run_number }}.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hd-video-player-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HD Video Player v1.0 (build ${{ github.run_number }})
          body: |
            Release APK built from HDVideoPlayer-source.zip.
            Signed with the debug key: installs on phones (allow "Install unknown apps"), not accepted by Play Store.
          files: out/*.apk
